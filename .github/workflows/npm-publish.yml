name: Publish TI to npm

on:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag matches the npm package version
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(readFileSync("npm/package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_NAME, `npm-v${version}`);
          NODE
      - run: npm install --global npm@11
      - run: bun install
      - run: bun run test:cli
      - run: bun run build:npm
      - run: bun run test:npm
      # Configure this workflow as @tscircuit/ti's npm trusted publisher.
      # See docs/npm-publishing.md for the one-time first publication.
      - run: npm publish ./dist/npm --access public --provenance
